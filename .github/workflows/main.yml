name: Build PhotoCraft Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      - name: Build PhotoCraft APK
        run: bash build.sh -photocraft

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCraft-Android
          path: output/*.apk
